<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}SudarX Entertainment{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block shell %}
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">
        <strong>SudarX</strong>
        <span>ENTERTAINMENT</span>
      </a>
      <div class="topbar-actions">
        <a href="/search" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.8">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>
        </a>
        <a href="/profile" class="avatar">{{ (user.email[0] if user else 'S')|upper }}</a>
      </div>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <nav class="tabbar">
      <a class="tab {% if active == 'home' %}active{% endif %}" href="/">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.8V21h14V9.8"></path></svg>
        HOME
      </a>
      <a class="tab {% if active == 'search' %}active{% endif %}" href="/search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        SEARCH
      </a>
      <a class="tab {% if active == 'downloads' %}active{% endif %}" href="/downloads">
        <svg viewBox="0 0 24 24"><path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M4 21h16"></path></svg>
        DOWNLOADS
      </a>
      <a class="tab {% if active == 'profile' %}active{% endif %}" href="/profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6.5 8-6.5S20 17 20 21"></path></svg>
        PROFILE
      </a>
    </nav>
  </div>
  {% endblock %}

  {% if msg %}<div class="toast">{{ msg }}</div>{% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
